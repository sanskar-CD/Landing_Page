<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GroTechMinds - Career Advancement</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #eff8ff;
            color: #0d1b2a;
            display: flex;
            justify-content: center;
            padding: 20px 0 60px 0;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            padding: 0 40px;
        }

        /* Logo Area */
        .navbar {
            padding: 10px 0 40px 0;
            font-size: 26px;
            font-weight: 800;
            display: flex;
            align-items: center;
        }
        
        .logo-sun { color: #5bc0eb; margin-left: 8px; font-size: 22px; }

        /* Hero Section */
        .hero-section {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 50px;
        }

        .hero-text {
            max-width: 55%;
        }

        h1 {
            font-size: 44px;
            line-height: 1.1;
            margin-bottom: 25px;
            font-weight: 800;
        }

        .highlight-brand {
            color: #7b61ff;
            display: block;
        }

        .sub-text {
            font-size: 22px;
            color: #1a2a3a;
            font-weight: 500;
            line-height: 1.4;
        }

        /* Vertical Cards */
        .v-cards-container {
            display: flex;
            gap: 15px;
        }

        .v-card {
            width: 105px;
            height: 150px;
            background: linear-gradient(180deg, #7b61ff 0%, #4facfe 100%);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            padding: 10px;
            box-shadow: 0 8px 20px rgba(123, 97, 255, 0.25);
        }

        .v-card i {
            font-size: 28px;
            margin-bottom: 12px;
            opacity: 0.9;
        }

        .v-card span {
            font-size: 13px;
            font-weight: 600;
            line-height: 1.2;
        }

        /* Horizontal Feature Row */
        .feature-row {
            display: flex;
            gap: 20px;
            margin-bottom: 50px;
        }

        .h-pill {
            flex: 1;
            display: flex;
            align-items: center;
            padding: 15px 20px;
            border-radius: 10px;
            color: white;
            font-weight: 600;
            font-size: 15px;
            background: linear-gradient(90deg, #7b61ff 0%, #4facfe 100%);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .h-pill i {
            margin-right: 12px;
            font-size: 20px;
        }

        /* Partner Section */
        .partners-box {
            background: white;
            border-radius: 12px;
            padding: 30px 40px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.04);
            margin-bottom: 40px;
        }

        .partners-box h3 {
            color: #0056b3;
            margin-bottom: 25px;
            font-size: 22px;
            font-weight: 600;
        }

        .logos-grid {
            display: flex;
            justify-content: space-around; /* Changed for better spacing */
            align-items: center;
            flex-wrap: wrap;
            gap: 30px;
        }

        .partner-logo {
            /* MADE LARGER */
            max-height: 70px; 
            max-width: 160px;
            object-fit: contain;
            /* REMOVED GRAYSCALE TO MAKE COLORFUL */
            filter: none; 
            opacity: 1;
            transition: transform 0.3s;
        }

        .partner-logo:hover {
            transform: scale(1.1); /* Adds a nice pop on hover */
        }

        /* CTA Button */
        .cta-container {
            display: flex;
            justify-content: center;
        }

        .cta-btn {
            background: linear-gradient(90deg, #0062ff 0%, #00a2ff 100%);
            color: white;
            border: none;
            padding: 16px 70px;
            font-size: 24px;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(0, 98, 255, 0.3);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .cta-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0, 98, 255, 0.4);
        }

    </style>
</head>
<body>

    <div class="container">
        <div class="navbar">
            GroTechMinds <i class="fa-solid fa-certificate logo-sun"></i>
        </div>

        <section class="hero-section">
            <div class="hero-text">
                <h1>
                    Unlock Your Potential with 
                    <span class="highlight-brand">GrotechMinds</span>
                </h1>
                <p class="sub-text">
                    Industry-Ready Online Courses for Career Advancement
                </p>
            </div>

            <div class="v-cards-container">
                <div class="v-card">
                    <i class="fa-solid fa-desktop"></i>
                    <span>Technical Focus</span>
                </div>
                <div class="v-card">
                    <i class="fa-solid fa-briefcase"></i>
                    <span>Domain Training</span>
                </div>
                <div class="v-card">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <span>Placement Support</span>
                </div>
            </div>
        </section>

        <section class="feature-row">
            <div class="h-pill">
                <i class="fa-solid fa-display"></i> Industry-Ready Online
            </div>
            <div class="h-pill">
                <i class="fa-solid fa-layer-group"></i> Domain Training
            </div>
            <div class="h-pill">
                <i class="fa-solid fa-search"></i> Placement Support
            </div>
        </section>

        <section class="partners-box">
            <h3>Our Placement Partners</h3>
            <div class="logos-grid">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSoDMAgstCwiH2376aMYr8gO-qFL0d5Cucuig&s" alt="Partner 1" class="partner-logo">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQlC4NrtlMbyFcSynG0EQ1wdV9mvfrzJNpRJw&s" alt="Partner 2" class="partner-logo">
                <img src="https://cdn-dynmedia-1.microsoft.com/is/image/microsoftcorp/RWCZER-Legal-IP-Trademarks-CP-MS-logo-740x417-1?wid=406&hei=230&fit=crop&resSharp=1" alt="Microsoft" class="partner-logo">
                <img src="https://media.licdn.com/dms/image/v2/C560BAQEGmEtbmmQv4Q/company-logo_200_200/company-logo_200_200/0/1654797535162/society_of_graphic_designers_of_canada_logo?e=2147483647&v=beta&t=YglabqMhCFcIEFVfo2xOHA7N0vnI-D5vdSLniE_0ZQI" alt="Partner 4" class="partner-logo">
            </div>
        </section>

        <div class="cta-container">
            <button class="cta-btn">Explore Courses</button>
        </div>
    </div>

</body>
</html>
